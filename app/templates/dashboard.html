{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card shadow-lg border-0 rounded-lg mt-5">
                <div class="card-body p-5">
                    <div class="mb-4">
                        <span class="badge bg-success text-white px-3 py-2 rounded-pill">🚀 Servicio activo</span>
                    </div>
                    <h1 class="display-4 fw-bold text-primary">Acortador de URLs</h1>
                    <p class="lead text-secondary mt-3">Acorta enlaces largos de forma sencilla y segura</p>
                    <hr class="my-4">
                    <div class="d-grid gap-3 col-8 mx-auto">
                        <a href="{{ url_for('register') }}" class="btn btn-primary btn-lg">📝 Registro</a>
                        <a href="{{ url_for('login') }}" class="btn btn-success btn-lg">🔐 Iniciar sesión</a>
                        <a href="{{ url_for('shorten') }}" class="btn btn-warning btn-lg">✂️ Acortar URL</a>
                        <a href="{{ url_for('docs') }}" class="btn btn-outline-secondary btn-lg">📚 Documentación API</a>
                    </div>
                    <div class="mt-4">
                        <small class="text-muted">
                            ¿Ya tienes cuenta? <a href="{{ url_for('login') }}" class="text-decoration-none">Inicia sesión</a> · 
                            ¿Problemas? <a href="{{ url_for('docs') }}" class="text-decoration-none">Consulta la API</a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
