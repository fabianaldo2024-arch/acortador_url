{% extends "base.html" %}
{% block content %}
<h1>Mis URLs</h1>
<form id="urlForm">
    <input type="url" id="original_url" placeholder="Ingresa tu URL" required>
    <button type="submit">Acortar</button>
</form>
<div id="urlList">
    {% for url in urls %}
    <div>
        <a href="/{{ url.short_code }}" target="_blank">{{ url.short_code }}</a>
        → {{ url.original_url }} ({{ url.clicks }} clics)
    </div>
    {% endfor %}
</div>
<script>
document.getElementById('urlForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
        return;
    }
    const response = await fetch('/api/urls', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({
            original_url: document.getElementById('original_url').value
        })
    });
    if (response.ok) {
        location.reload();
    } else {
        alert('Error al crear la URL');
    }
});
</script>
{% endblock %}
